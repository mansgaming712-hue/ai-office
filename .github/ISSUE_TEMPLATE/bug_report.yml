name: Bug report
description: Something does not work the way the README describes
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please do not report security problems here. Use the private
        Security tab instead.
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of `node -v`
      placeholder: "v22.12.0"
    validations:
      required: true
  - type: dropdown
    id: ui-lang
    attributes:
      label: UI language
      description: The language of the dashboard (the EN / ID buttons, or the browser language on first visit).
      options:
        - English
        - Bahasa Indonesia
        - Mixed or not sure
    validations:
      required: true
  - type: dropdown
    id: task-kind
    attributes:
      label: What did you use when the bug happened?
      options:
        - "Demo button (server demo, no Claude Code)"
        - "Simulation button (local animation, no server task)"
        - "A real task from the command box (Claude Code runner)"
        - "Only the Claude Code hooks (no task from the dashboard)"
    validations:
      required: true
  - type: input
    id: claude-version
    attributes:
      label: Claude Code CLI version
      description: Output of `claude --version`. Only needed if you ran a real task or the hooks. Leave empty for the demo or the simulation.
      placeholder: "2.x.x"
    validations:
      required: false
  - type: dropdown
    id: run-mode
    attributes:
      label: How do you run the server?
      options:
        - "npm start or npm run serve (manual)"
        - "Autostart (npm run autostart:install)"
        - "Other (describe in the steps)"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps, starting from a fresh clone if possible.
      placeholder: |
        1. Run `npm run setup`
        2. Run `npm start`
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Describe what happened. Add a screenshot if it helps.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Paste the relevant output. Before you paste, remove every token, API key, password, and personal path
        (for example your user name in a folder path). Do not paste the contents of `.env`, a token file, or the
        runner key file (`~/.ai-office/runner-key`).
      render: text
