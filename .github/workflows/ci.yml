# CI AI Office: build dan test di Windows, macOS, dan Linux.
# Tanpa secret, hanya izin baca. `npm run agents:validate` sengaja TIDAK dijalankan di sini karena
# memeriksa ~/.claude/agents milik pengguna (tidak ada di runner).
#
# Node minimum untuk RUNTIME adalah 20.12 (engines), tetapi toolchain dev (vitest 5 butuh Node
# ^22.12 atau ^24; vite 8 butuh ^20.19 atau >=22.12) lebih baru. Karena itu:
#   - job "test"        : build + test penuh di Node 22.12 (minimum toolchain) dan LTS terbaru;
#   - job "runtime-min" : runtime murni di Node 20.12 (npm ci --omit=dev + smoke server).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22.12', 'lts/*']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  runtime-min:
    name: runtime (${{ matrix.os }}, Node 20.12)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.12'
          cache: npm

      - name: Install dependencies (produksi saja)
        run: npm ci --omit=dev

      - name: Smoke test server
        run: npm run smoke

      - name: Autostart dry-run
        run: node scripts/autostart.mjs install --dry-run
