# CI AI Office: build dan test di Windows, macOS, dan Linux.
# Tanpa secret, hanya izin baca. `npm run agents:validate` sengaja TIDAK dijalankan di sini karena
# memeriksa ~/.claude/agents milik pengguna (tidak ada di runner).
#
# Node minimum untuk semua hal (server, hook, build, test) adalah 22.12 (engines). Matrix menguji versi
# minimum itu dan LTS terbaru. Action dipin ke SHA commit (komentar menyebut tag asalnya), supaya tag yang
# digeser tidak bisa menjalankan kode lain di CI.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22.12', 'lts/*']
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
