# AI Office: konfigurasi SEMENTARA, hanya dipakai deploy/setup-vps.sh sebelum sertifikat
# Let's Encrypt pertama terbit (konfigurasi HTTPS penuh butuh file sertifikat yang belum ada).
# Tidak meneruskan apa pun ke app: app tidak pernah disajikan lewat HTTP biasa.
# Setelah certbot berhasil, file ini diganti oleh deploy/nginx/ai-office.conf.
# Domain: __DOMAIN__ (placeholder di template, diganti otomatis oleh setup-vps.sh).

# Host tak dikenal (akses lewat IP langsung, pemindai): tutup koneksi tanpa jawaban.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_tokens off;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        default_type text/plain;
        return 503 "AI Office sedang disiapkan (menunggu sertifikat HTTPS).\n";
    }
}
