# AI Office: Nginx reverse proxy + TLS (Let's Encrypt).
#
# Domain: __DOMAIN__
# (Di template deploy/nginx/ai-office.conf domain ditulis sebagai placeholder dua garis bawah +
# DOMAIN + dua garis bawah; deploy/setup-vps.sh menggantinya dengan domain asli, mis.
# office.example.com, lalu memasangnya ke /etc/nginx/sites-available/ai-office.conf.)
# Memasang manual: ganti semua placeholder, pastikan sertifikat sudah ada, lalu
#   sudo nginx -t && sudo systemctl reload nginx
#
# File ini di-include di dalam blok http {} (lewat /etc/nginx/sites-enabled/), jadi
# limit_req_zone, limit_conn_zone, map, dan upstream boleh ditulis di sini. Nama diberi awalan
# "aioffice_" supaya tidak bentrok dengan situs lain di server yang sama.
#
# App Node mendengar di 127.0.0.1:3000 (lihat deploy/systemd/ai-office.service) dan memakai
# AI_OFFICE_TRUST_PROXY=1: ia percaya X-Real-IP (IP klien) dan X-Forwarded-Proto (HTTPS)
# yang ditulis Nginx di bawah. Nginx selalu MENIMPA header ini, jadi klien tidak bisa memalsukannya.
#
# File ini juga memasang server "default_server" untuk port 80 dan 443 yang menolak Host/SNI
# selain __DOMAIN__. Jangan ada situs lain di server ini yang juga memakai default_server
# (nginx -t akan gagal dengan "duplicate default server").

# --- Batas laju dan koneksi per IP klien (selebihnya HTTP 429) ---------------------------
# Login: 5 per menit per IP, boleh lonjakan 5.
limit_req_zone $binary_remote_addr zone=aioffice_login:10m rate=5r/m;

# API /api/* (selain /api/login yang punya zona sendiri). Hooks di komputer CEO mengirim satu
# POST /api/events per pemakaian tool, jadi saat beberapa agen bekerja paralel bisa beberapa event
# per detik. 10 per detik per IP dengan lonjakan 100 jauh di atas pemakaian normal, tetapi tetap
# menghentikan banjir permintaan dari satu IP.
# Kunci zona hanya terisi untuk URI /api/*. Permintaan dengan kunci kosong (UI, aset) tidak
# dihitung, jadi memuat halaman tidak pernah kena batas ini.
map $uri $aioffice_api_limit_key {
    default "";
    ~^/api/ $binary_remote_addr;
}
limit_req_zone $aioffice_api_limit_key zone=aioffice_api:10m rate=10r/s;

# WebSocket /ws: yang dihitung adalah permintaan upgrade (sekali per koneksi), bukan pesan di
# dalamnya. Browser menyambung ulang dengan jeda 0,5 sampai 10 detik, jadi 30 per menit +
# lonjakan 20 cukup longgar untuk beberapa tab sekaligus. Maksimal 20 WebSocket terbuka per IP.
limit_req_zone $binary_remote_addr zone=aioffice_ws:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=aioffice_ws_conn:10m;

map $http_upgrade $aioffice_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream aioffice_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

# --- Host tak dikenal: tutup koneksi tanpa jawaban --------------------------------------
# Permintaan ke IP VPS langsung atau dengan Host/SNI selain __DOMAIN__ (pemindai internet,
# DNS rebinding) tidak pernah sampai ke app. 444 = Nginx menutup koneksi tanpa respons.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_tokens off;
    return 444;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_tokens off;
    # Pengaturan TLS SAMA dengan server aplikasi di bawah. Sebagian (cache/tiket sesi, dan di
    # Nginx lama juga protokol) diambil dari server default saat handshake, jadi wajib ada di sini.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:aioffice_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # Handshake TLS dengan SNI selain __DOMAIN__ (atau tanpa SNI) langsung ditolak, tanpa
    # sertifikat. Butuh Nginx >= 1.19.4 (Ubuntu 24.04: 1.24). Di Nginx lama (Ubuntu 22.04: 1.18)
    # setup-vps.sh mengganti baris di bawah dengan sertifikat domain ini: handshake selesai,
    # lalu koneksi tetap ditutup oleh "return 444".
    ssl_reject_handshake on;
    return 444;
}

# --- HTTP: hanya untuk validasi Let's Encrypt dan redirect ke HTTPS ---------------------
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    server_tokens off;

    # Dipakai certbot (webroot) saat menerbitkan dan memperbarui sertifikat.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://__DOMAIN__$request_uri;
    }
}

# --- HTTPS: aplikasi -------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:aioffice_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Header keamanan untuk SEMUA respons: UI, API (JSON), dan halaman error Nginx.
    # - HSTS 1 tahun, hanya untuk domain ini (tanpa includeSubDomains/preload supaya subdomain
    #   lain milik CEO tidak ikut dipaksa HTTPS).
    # - nosniff dan Referrer-Policy: app hanya mengirimnya untuk UI, belum untuk respons API.
    #   Versi dari app disembunyikan lalu ditulis ulang di sini (nilai sama) supaya tidak dobel.
    # - CSP dan X-Frame-Options tetap dikirim app (CSP memuat nama host).
    # PENTING: jangan menaruh add_header atau proxy_hide_header di dalam location. Location yang
    # punya salah satunya tidak lagi mewarisi daftar di bawah (termasuk HSTS).
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    limit_req_status 429;
    limit_conn_status 429;

    # Sama dengan batas body di server (64 KB). Lebih besar -> 413 dari Nginx.
    client_max_body_size 64k;

    # Kompres aset statis saja (bukan JSON API).
    gzip on;
    gzip_types text/css text/javascript application/javascript image/svg+xml;

    access_log /var/log/nginx/ai-office.access.log;
    error_log  /var/log/nginx/ai-office.error.log warn;

    # WebSocket: koneksi lama, upgrade HTTP/1.1. Server mengirim ping tiap 30 detik.
    location = /ws {
        limit_req zone=aioffice_ws burst=20 nodelay;
        limit_conn aioffice_ws_conn 20;

        proxy_pass http://aioffice_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $aioffice_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    # Login: dibatasi laju per IP (lebih ketat dari API lain).
    location = /api/login {
        limit_req zone=aioffice_login burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://aioffice_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Semua yang lain: UI (dist/), /api/health, /api/session, /api/logout, /api/events.
    # limit_req di sini hanya menghitung /api/* (lihat map $aioffice_api_limit_key di atas).
    location / {
        limit_req zone=aioffice_api burst=100 nodelay;

        proxy_pass http://aioffice_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
